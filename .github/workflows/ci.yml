name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Needs the CONVEX_DEPLOY_KEY repo secret (Convex dashboard → Settings
      # → Deploy keys) before this works — see docs/DECISIONS.md.
      - run: npx convex codegen --typecheck disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # No CONVEX_DEPLOY_KEY needed here — convex-test runs entirely
      # in-memory, no real deployment involved.
      - run: pnpm test:convex

      - run: pnpm build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
